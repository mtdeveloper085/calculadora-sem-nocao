<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculadora Sem Noção 😂</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#fff0f7,#e9f7ff);min-height:100vh;display:grid;place-items:center;padding:18px}
.calc{width:min(390px,100%);background:#151522;border-radius:30px;padding:20px;box-shadow:0 20px 50px #0003}
h1{color:#fff;margin:0 0 4px;font-size:25px}.sub{color:#aaa8bb;font-size:13px;margin-bottom:16px}
.display{background:#242436;border-radius:20px;padding:15px;text-align:right;min-height:92px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.expr{color:#aaa8bb;font-size:16px;min-height:24px}.result{color:white;font-size:38px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
button{border:0;border-radius:17px;height:62px;font-size:22px;font-weight:750;cursor:pointer;background:#303047;color:#fff;box-shadow:inset 0 -3px #0002}
button:active{transform:scale(.96)}.op{background:#ff7a59}.equal{background:#7c5cff;grid-row:span 2;height:134px}.zero{grid-column:span 2}.clear{background:#f14f78}
.joke{margin-top:14px;background:#ffe66d;color:#262626;border-radius:17px;padding:12px;font-weight:750;text-align:center;min-height:48px}
</style>
</head>
<body>
<main class="calc">
<h1>Calculadora Sem Noção 😂</h1><div class="sub">Ela calcula. O julgamento é grátis.</div>
<section class="display"><div class="expr" id="expr"></div><div class="result" id="display">0</div></section>
<div class="grid">
<button class="clear" onclick="clearAll()">AC</button><button onclick="back()">⌫</button><button onclick="percent()">%</button><button class="op" onclick="input('/')">÷</button>
<button onclick="input('7')">7</button><button onclick="input('8')">8</button><button onclick="input('9')">9</button><button class="op" onclick="input('*')">×</button>
<button onclick="input('4')">4</button><button onclick="input('5')">5</button><button onclick="input('6')">6</button><button class="op" onclick="input('-')">−</button>
<button onclick="input('1')">1</button><button onclick="input('2')">2</button><button onclick="input('3')">3</button><button class="op" onclick="input('+')">+</button>
<button class="zero" onclick="input('0')">0</button><button onclick="input('.')">.</button><button class="equal" onclick="calculate()">=</button>
</div><div class="joke" id="joke">Digite uma conta. Prometo não contar pra ninguém. 🤐</div>
</main>
<script>
let expr="";
const d=document.getElementById("display"), e=document.getElementById("expr"), j=document.getElementById("joke");
const jokes=["A matemática não erra. Você que insiste. 😂","Conta feita! Agora falta pagar. 💸","Isso foi cálculo ou tentativa? 🤨","Resultado oficialmente aprovado pelo Instituto do Chute. 🧮","Até a calculadora ficou surpresa. 😳","Pronto. Pode fingir que você fez de cabeça. 😎","A conta fechou. Sua carteira talvez não. 💸"];
function render(){e.textContent=expr;d.textContent=expr||"0"}
function input(x){if(expr.length>30)return;if(/[+\-*/.]/.test(x)&&/[+\-*/.]$/.test(expr))return;expr+=x;render()}
function clearAll(){expr="";render();j.textContent="Digite uma conta. Prometo não contar pra ninguém. 🤐"}
function back(){expr=expr.slice(0,-1);render()}
function percent(){if(!expr)return;let m=expr.match(/(\d+(\.\d+)?)$/);if(m){let n=parseFloat(m[1])/100;expr=expr.slice(0,-m[1].length)+n;render()}}
function calculate(){
 if(!expr)return;
 if(!/^[0-9+\-*/.() ]+$/.test(expr))return;
 try{
   let val=Function('"use strict";return ('+expr+')')();
   if(!Number.isFinite(val))throw Error();
   val=Math.round((val+Number.EPSILON)*1e10)/1e10;
   e.textContent=expr+" =";d.textContent=String(val);j.textContent=jokes[Math.floor(Math.random()*jokes.length)];expr=String(val);
 }catch{d.textContent="🤡";j.textContent="Nem eu entendi essa conta."}
}
document.addEventListener("keydown",ev=>{if(/[0-9.+\-*/]/.test(ev.key))input(ev.key);else if(ev.key==="Enter"||ev.key==="=")calculate();else if(ev.key==="Backspace")back();else if(ev.key==="Escape")clearAll()});
</script>
</body>
</html>
