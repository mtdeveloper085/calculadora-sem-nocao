name: Gerar APK Compatível

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Aumentar compatibilidade Android
        run: |
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 23/' android/variables.gradle || true
          cat android/variables.gradle

      - name: Gerar APK universal
        working-directory: android
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Verificar APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --verbose android/app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-sem-nocao-apk-compativel
          path: android/app/build/outputs/apk/debug/app-debug.apk
